name: Educational model tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine.test.mjs tests/virtual-plc.test.mjs
      - run: node --check docs/app.js && node --check docs/virtual-ui.js
